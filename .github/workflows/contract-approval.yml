name: contract-approval

# Passes when every code owner of every file the pull request touches has approved its current head
# commit, or authored the pull request. Owners come from .github/CODEOWNERS, resolved per file the way
# GitHub does (last matching rule wins), so one area's contracts can need one set of people and
# another area's a different set. An approval given to an earlier commit does not count: a new push needs fresh
# approvals.
#
# A push starts the check. A review does not start another: it re-runs the push's run, so a head
# commit ever carries one `check`, whose verdict is the latest event's. Two runs of the same name on
# one commit would both have to pass for the branch rule to be satisfied, and the push's run — made
# before anyone could approve — fails by construction.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  rerun:
    if: github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const head = context.payload.pull_request.head.sha;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'contract-approval.yml', head_sha: head, event: 'pull_request', per_page: 100,
            });
            const run = runs.sort((a, b) => b.run_number - a.run_number)[0];
            if (!run) return core.setFailed(`No pull_request run of this workflow on ${head.slice(0, 7)} to re-run.`);
            if (run.status !== 'completed') return core.info(`Run ${run.id} is still ${run.status}; it will judge the current reviews.`);
            await github.rest.actions.reRunWorkflow({ ...context.repo, run_id: run.id });
            core.info(`Re-running ${run.id} on ${head.slice(0, 7)}.`);

  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const head = pr.head.sha;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };

            // CODEOWNERS: gitignore-style patterns, last matching rule wins.
            function toRegex(pattern) {
              let p = pattern.trim();
              const anchored = p.startsWith('/');
              if (anchored) p = p.slice(1);
              if (p.endsWith('/')) p = p.slice(0, -1);
              const hasSlash = p.includes('/');
              let re = '';
              for (let i = 0; i < p.length; i++) {
                const c = p[i];
                if (c === '*') {
                  if (p[i + 1] === '*') { re += '.*'; i++; if (p[i + 1] === '/') i++; }
                  else re += '[^/]*';
                } else if (c === '?') {
                  re += '[^/]';
                } else {
                  re += c.replace(/[.+^$(){}|[\]\\]/, '\\$&');
                }
              }
              return new RegExp(((anchored || hasSlash) ? '^' : '(^|/)') + re + '(/.*)?$');
            }
            const rules = fs.readFileSync('.github/CODEOWNERS', 'utf8')
              .split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'))
              .map(l => { const [pat, ...o] = l.split(/\s+/); return { re: toRegex(pat), owners: o.map(x => x.replace(/^@/, '').toLowerCase()) }; });
            function ownersOf(file) {
              let hit = null;
              for (const r of rules) if (r.re.test(file)) hit = r;
              return hit ? hit.owners : [];
            }

            // The owners this pull request needs: the union over every file it touches.
            const files = await github.paginate(github.rest.pulls.listFiles, { ...repo, pull_number: pr.number, per_page: 100 });
            const needed = new Map();
            const unowned = [];
            for (const f of files) {
              const owners = ownersOf(f.filename);
              if (owners.length === 0 && f.filename.startsWith('contracts/')) unowned.push(f.filename);
              for (const o of owners) {
                if (!needed.has(o)) needed.set(o, []);
                needed.get(o).push(f.filename);
              }
            }

            // Latest review per user decides; only APPROVED at the current head counts.
            const reviews = await github.paginate(github.rest.pulls.listReviews, { ...repo, pull_number: pr.number, per_page: 100 });
            const latest = new Map();
            for (const r of reviews) {
              if (r.state === 'COMMENTED') continue;
              latest.set(r.user.login.toLowerCase(), r);
            }

            const author = pr.user.login.toLowerCase();
            const missing = [], stale = [];
            for (const [owner, ownedFiles] of needed) {
              if (owner === author) continue;
              const r = latest.get(owner);
              if (!r || r.state !== 'APPROVED') missing.push(`@${owner} (${ownedFiles.join(', ')})`);
              else if (r.commit_id !== head) stale.push(`@${owner} approved ${r.commit_id.slice(0, 7)}, head is ${head.slice(0, 7)}`);
            }

            const lines = [`Head: ${head.slice(0, 7)}`, `Owners for the files touched: ${[...needed.keys()].map(o => '@' + o).join(' ') || 'none'}`];
            if (needed.has(author)) lines.push(`@${author} authored this pull request.`);
            if (missing.length) lines.push(`Not approved: ${missing.join('; ')}`);
            if (stale.length) lines.push(`Approved an earlier commit: ${stale.join('; ')}`);
            if (unowned.length) lines.push(`No CODEOWNERS rule covers: ${unowned.join(', ')}`);
            core.summary.addRaw(lines.join('\n\n')).write();

            if (unowned.length) {
              core.setFailed('Every contract file must be covered by a CODEOWNERS rule.');
            } else if (missing.length || stale.length) {
              core.setFailed('Every code owner of the touched files must approve the current head commit.');
            } else {
              core.info('All code owners of the touched files have approved the current head commit.');
            }
